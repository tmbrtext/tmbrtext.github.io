<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>tmbrtext2</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 48px 24px; text-align: center; color: #222; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #eee; background: #111; } a.button { background: #eee; color: #111; } }
  p { line-height: 1.6; }
  a.button { display: inline-block; margin-top: 16px; padding: 12px 24px; border-radius: 8px; background: #222; color: #fff; text-decoration: none; }
</style>
</head>
<body>
<p id="msg">tmbrtext2 に戻っています…<br>Returning to tmbrtext2…</p>
<a id="back" class="button" href="#" hidden>アプリに戻る / Open the app</a>
<script>
  // Tumblr の OAuth2 リダイレクトを受け、クエリ（code / state / error）をそのままアプリへ渡す。
  // 開発用は ?env=dev ではなくパスで分ける（/oauth/callback-dev/ に同じファイルを置き、SCHEME を差し替える）。
  var SCHEME = 'tmbrtext2-dev://oauth/callback';
  var target = SCHEME + window.location.search;
  // 認可コードを閲覧履歴に残さないよう replace で遷移する。
  window.location.replace(target);
  // 自動で開かない端末向けの手動ボタン。
  var back = document.getElementById('back');
  back.href = target;
  setTimeout(function () { back.hidden = false; }, 1200);
</script>
</body>
</html>
